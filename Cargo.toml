[package]
name = "octane"
version = "0.1.2"
authors = ["weegee <somilsharma627@gmail.com>", "aplet123 <aplet@aplet.me>"]
description = "A web server which is express-like, intuitive and high-powered"
license-file = "LICENSE"
homepage = "https://github.com/OctaneWeb/Octane"
readme = "README.md"
edition = "2018"
rust-version = "1.85"

[dependencies]
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"], optional = true }
openssl = { version = "0.10.30", optional = true }
tokio-openssl = { version = "0.6.5", optional = true }
tokio = { version = "1.54.1", features = ["net", "io-util", "rt", "fs", "sync", "time"] }
socket2 = "0.6.5"
serde = { version = "1.0.123", optional = true }
serde_json = { version = "1.0.59", optional = true }

[dependencies.octane_macros]
path = "octane_macros"
version = "0.1.2"

[dependencies.octane_http]
path = "octane_http"
version = "0.1"

[features]
default = ["faithful", "query_strings", "cookies", "url_variables", "raw_headers"]
faithful = []
test_crate = []
raw_headers = []
query_strings = []
extended_queries = []
cookies = []
json = ["serde", "serde_json"]
url_variables = []
rustls = ["tokio-rustls"]
openSSL = ["openssl", "tokio-openssl"]
# exposes the parsers to the fuzz targets in octane_http/fuzz, not a stable API
fuzzing = []

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
curl = "0.4.33"

[workspace]
resolver = "2"
members = [
    "octane_macros",
    "octane_http"
]
