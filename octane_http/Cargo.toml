[package]
name = "octane_http"
version = "0.1.0"
authors = ["Daksh14 <41485688+Daksh14@users.noreply.github.com>"]
description = "HTTP/1.x parsing and types for Octane."
license-file = "../LICENSE"
homepage = "https://github.com/OctaneWeb/Octane"
edition = "2018"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies.octane_macros]
path = "../octane_macros"
version = "0.1.2"

[dependencies]
tokio = { version = "1.54.1", optional = true }

# only built for WASIp3, and only with the `wasm` feature
[target.'cfg(all(target_os = "wasi", target_env = "p3"))'.dependencies]
wasip3 = { version = "0.9.0", default-features = false, features = ["async-spawn"], optional = true }

[features]
default = ["std"]
# The protocol core (parsing, encoding, the blocking serve loop) only needs
# `core`. `std` adds the tokio reader and an adapter for `std::io` streams.
std = ["tokio"]
# `wasip3`: serving over wasi:sockets from a WASIp3 component. It only has an
# effect when building for wasm32-wasip3.
wasm = ["dep:wasip3"]

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt"] }

[[example]]
name = "portable_server"
required-features = ["std"]
