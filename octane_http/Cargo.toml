[package]
name = "octane_http"
version = "0.1.0"
authors = ["Daksh14 <41485688+Daksh14@users.noreply.github.com>"]
edition = "2018"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies.octane_macros]
path = "../octane_macros"
version = "0.1.2"

[dependencies]
tokio = { version = "1.54.1", optional = true }

[features]
default = ["std"]
# The protocol core (parsing, encoding, the blocking serve loop) only needs
# `core`. `std` adds the tokio reader and an adapter for `std::io` streams.
std = ["tokio"]

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt"] }

[[example]]
name = "portable_server"
required-features = ["std"]
